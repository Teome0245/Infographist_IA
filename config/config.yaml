project:
  assets_dir: "/mnt/b/Infographiste_IA/assets/images"
  dataset_dir: "dataset/inspiration_mmorpg"
  workflows_dir: "workflows"
  data_root: "/mnt/b/Infographiste_IA"

infra:
  # LOCAL ou DISTRIBUTED (peut être surchargé par env INFRA_MODE)
  mode: "LOCAL"

  local:
    base_url: "http://127.0.0.1:8188"
    request_timeout_s: 30
    poll_interval_s: 2
    job_timeout_s: 1800

  distributed:
    # 110 = reverse proxy (Nginx) | 140 = GPU worker ComfyUI direct
    targets:
      "110":
        base_url: "http://192.168.0.110:8189"
      "140":
        base_url: "http://192.168.0.140:8188"
    request_timeout_s: 60
    poll_interval_s: 3
    job_timeout_s: 14400

storage:
  # LOCAL: NAS monté | DISTRIBUTED: NAS sur VMs 110/140
  backend: "NAS"
  nas:
    mount_path: "/mnt/nas_lbg/Infographiste_IA"
    unc: "//Nas_lbg/nas/LBG_Cloud_Drive/Infographiste_IA"
    subdirs:
      dataset: "dataset"
      lora: "lora"
      assets: "assets/images"
      kohya_train: "kohya_train"
      exports_3d: "exports_3d"
  s3:
    bucket: "my-mmorpgh-assets-bucket"
    prefix: "infographiste-virtuel"
    region: "eu-west-3"

workflow:
  # Node IDs pour workflow_sd15_lowvram.json / workflow_sd15_lora_lowvram.json
  prompt_nodes: ["6"]
  negative_nodes: ["7"]
  lora_nodes: ["10"]

dataset:
  # Symlink vers NAS (après scripts/mount_nas_dataset.sh)
  inspiration_dir: "dataset/inspiration_mmorpg"

lora:
  local_lora_dir: "/mnt/b/Infographiste_IA/lora"
  kohya_train_dir: "/mnt/b/Infographiste_IA/kohya_train"

